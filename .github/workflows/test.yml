name: Tests and deploy
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  # GitHub Pages serves the gh-pages branch. After tests pass on main,
  # copy main to gh-pages so the live site only ever gets tested code.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Stamp every script and style URL with this commit so phones and
      # browsers always load the newest code right after a deploy.
      - name: Stamp asset versions
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(from '\./[A-Za-z0-9_-]+\.js)'#\1?v=$V'#g" src/*.js
          sed -i -E "s#\?v=[A-Za-z0-9_-]+#?v=$V#g" index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Deploy $V" || true
      - run: git push --force origin HEAD:refs/heads/gh-pages
